<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,user-scalable=no"
/>

<title>カバファイト</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
/>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
/>

<link
  href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="style.css" />

</head>

<body>

<div id="loadingScreen">

  <div class="loadingBox">

    <p class="loadingText">
      NOW LOADING...
    </p>

    <div class="loadingBar">

      <div
        id="loadingFill"
        class="loadingFill"
      ></div>

    </div>

    <p
      id="loadingCount"
      class="loadingCount"
    >
      0%
    </p>

  </div>

</div>

<div id="app">

  <section
    id="titleScreen"
    class="screen"
  >

    <div class="menuBox">

      <img
        src="assets/title.png"
        id="titleLogo"
        alt="カバファイト"
      />

      <p class="ruleText">
        間合いを読んで一撃勝負！<br>
        ナス・トマト・歯を<br>
        カバパンチでぶっとばせ！
      </p>

      <button
        id="startBtn"
        class="menuBtn"
      >
        タップしてスタート
      </button>

    </div>

  </section>

  <section
    id="gameScreen"
    class="screen"
  >

    <canvas
      id="gameCanvas"
      width="360"
      height="640"
    ></canvas>

    <div id="battleHud">

      <div class="nameRow">

        <div class="fighterName">
          KABA
        </div>

        <div id="timer">
          45
        </div>

        <div
          class="fighterName enemy"
          id="enemyName"
        >
          NASU
        </div>

      </div>

      <div class="hpRow">

        <div class="hpBox">
          <div
            id="playerHp"
            class="hpFill"
          ></div>
        </div>

        <div class="hpBox">
          <div
            id="enemyHp"
            class="hpFill enemyHp"
          ></div>
        </div>

      </div>

    </div>

    <button id="backBtn">
      タイトルへ
    </button>

    <div id="battleMessage"></div>

    <div id="controls">

      <div class="moveButtons">

        <button
          id="leftBtn"
          class="controlBtn dirBtn"
        >
          ◀
        </button>

        <button
          id="rightBtn"
          class="controlBtn dirBtn"
        >
          ▶
        </button>

      </div>

      <div class="actionButtons">

        <button
          id="punchBtn"
          class="controlBtn"
        >
          PUNCH
        </button>

        <button
          id="dashBtn"
          class="controlBtn dashBtn"
        >
          DASH
        </button>

      </div>

    </div>

  </section>

  <section
    id="resultScreen"
    class="screen"
  >

    <div class="menuBox">

      <h2 id="resultTitle">
        ALL CLEAR!!
      </h2>

      <canvas
        id="resultCanvas"
        width="128"
        height="128"
      ></canvas>

      <p id="resultText">
        全3ステージクリア！
      </p>

      <div class="resultButtons">

        <button
          id="shareBtn"
          class="menuBtn"
        >
          Xでシェア
        </button>

        <button
          id="retryBtn"
          class="menuBtn"
        >
          もう1回遊ぶ
        </button>

        <button
          id="homeBtn"
          class="menuBtn sub"
        >
          カバゲーセンへ
        </button>

      </div>

    </div>

  </section>

</div>

<script src="game.js"></script>

</body>
</html>
